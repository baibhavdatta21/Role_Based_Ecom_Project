##spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
server.port=8083
spring.datasource.url= ${ORDER_DB_URL}
spring.datasource.username=${ORDER_DB_USERNAME}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database=MYSQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.show-groups=true
# Additional useful endpoints
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=health
management.endpoints.web.path-mapping.prometheus=prometheus

# Enable Circuit Breaker in Actuator
management.health.circuitbreakers.enabled=true
# Show metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Info endpoint details
management.info.git.mode=full
management.info.java.enabled=true
management.info.os.enabled=true

#Circuit Breaker
# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.productServ.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productServ.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productServ.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productServ.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productServ.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productServ.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productServ.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.productServ.slidingWindowType=count_based

resilience4j.retry.instances.retryBreaker.maxAttempts=5
resilience4j.retry.instances.retryBreaker.waitDuration=500ms