server.port=8081
spring.jpa.show-sql=true
spring.datasource.url=${PRODUCT_DB_URL}
spring.datasource.username=${PRODUCT_DB_USERNAME}
spring.datasource.password=${PRODUCT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=MYSQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.show-groups=true
# Additional useful endpoints
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=health
management.endpoints.web.path-mapping.prometheus=prometheus

# Show metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Info endpoint details
management.info.git.mode=full
management.info.java.enabled=true
management.info.os.enabled=true
# Enable Circuit Breaker in Actuator
management.health.circuitbreakers.enabled=true

logging.level.com.ecommerce=INFO
logging.file.path=logs/product-service
logging.file.name=logs/product-service/product-service.log
